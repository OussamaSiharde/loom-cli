name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests
        run: mvn -B verify
      - name: Build (javac only, zero dependencies)
        run: ./build.sh
      - name: Smoke-test the generation matrix
        run: ./scripts/smoke.sh
